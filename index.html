<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chime Wall Refactored</title>
    <!-- p5.js and p5.sound library via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #e0e0e0;
            --accent-color: #9f7aea;
            --accent-hover: #805ad5;
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.3);
        }

        /* Basic styles for a clean, dark theme */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent scrollbars */
            height: 100vh;
            width: 100vw;
        }

        /* The main container for the p5.js canvas, fills the whole screen */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* --- UI Container --- */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1rem;
            box-sizing: border-box;
            gap: 1rem;
            pointer-events: none; /* Allow clicks to pass through gaps */
            z-index: 10;
        }

        .glass-panel {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            pointer-events: auto; /* Re-enable clicks */
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: max-height 0.3s ease;
            max-height: 500px; /* Arbitrary max for animation */
        }
        
        .glass-panel.collapsed {
            max-height: 48px; /* Approximate header height */
        }

        .panel-header {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            user-select: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }
        
        .glass-panel:not(.collapsed) .panel-header {
            border-bottom: 1px solid var(--glass-border);
        }

        .panel-toggle {
            font-size: 0.8rem;
            transition: transform 0.3s;
        }

        .glass-panel.collapsed .panel-toggle {
            transform: rotate(-90deg);
        }

        .panel-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.85rem;
        }

        /* --- Form Elements --- */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            color: #aaa;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
        }

        span.value-display {
            color: var(--accent-color);
            font-weight: bold;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--input-bg);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--accent-hover);
        }

        select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            cursor: pointer;
        }
        
        select:focus {
            border-color: var(--accent-color);
        }

        .checkbox-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        
        input[type="checkbox"] {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button.ui-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        button.ui-btn:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* --- Start Overlay --- */
        #start-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        #start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #start-button {
            padding: 1rem 2rem;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            animation: pulse 2s infinite;
            transition: background-color 0.3s;
        }
        
        #start-button:disabled {
            background-color: #555;
            cursor: not-allowed;
            animation: none;
        }

        #start-button:hover:not(:disabled) {
            background-color: var(--accent-hover);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "smplr": "https://cdn.jsdelivr.net/npm/smplr@0.6.0/+esm"
  }
}
</script>
</head>
<body>
    <!-- Start overlay to initialize audio context -->
    <div id="start-overlay">
        <button id="start-button">Loading Instruments...</button>
    </div>

    <!-- UI Overlay -->
    <div id="ui-container">
        <!-- Panel 1: Simulation -->
        <div class="glass-panel">
            <div class="panel-header">
                Simulation <span class="panel-toggle">▼</span>
            </div>
            <div class="panel-content">
                <div class="control-group">
                    <label>BPM <span id="val-bpm" class="value-display">45</span></label>
                    <input type="range" id="inp-bpm" min="30" max="120" value="45">
                </div>
                <div class="control-group">
                    <label>Max Cycle <span id="val-cycle" class="value-display">9</span></label>
                    <input type="range" id="inp-cycle" min="1" max="20" value="9">
                </div>
                <div class="control-group checkbox-group">
                    <input type="checkbox" id="inp-infinite">
                    <label for="inp-infinite" style="cursor: pointer; color: var(--text-color);">Infinite Lifespan</label>
                </div>
                <div class="button-group">
                    <button class="ui-btn" id="btn-remove">Remove Last</button>
                    <button class="ui-btn" id="btn-reset">Reset</button>
                </div>
            </div>
        </div>

        <!-- Panel 2: Sound -->
        <div class="glass-panel">
            <div class="panel-header">
                Sound <span class="panel-toggle">▼</span>
            </div>
            <div class="panel-content">
                <div class="control-group">
                    <label>Volume <span id="val-vol" class="value-display">70</span></label>
                    <input type="range" id="inp-vol" min="0" max="100" value="70">
                </div>
                <div class="control-group">
                    <label>Instrument</label>
                    <select id="inp-instrument">
                        <option value="Piano">Piano</option>
                        <option value="Rhodes">Rhodes</option>
                        <option value="Guitar">Guitar</option>
                        <option value="Xylophone">Xylophone</option>
                        <option value="Music Box">Music Box</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Reverb Mix <span id="val-rev" class="value-display">40</span></label>
                    <input type="range" id="inp-rev" min="0" max="100" value="40">
                </div>
                <div class="control-group">
                    <label>Reverb Time <span id="val-revtime" class="value-display">40</span></label>
                    <input type="range" id="inp-revtime" min="0" max="100" value="40">
                </div>
            </div>
        </div>

        <!-- Panel 3: Harmony -->
        <div class="glass-panel">
            <div class="panel-header">
                Harmony <span class="panel-toggle">▼</span>
            </div>
            <div class="panel-content">
                <div class="control-group">
                    <label>Base Note <span id="val-base" class="value-display">48</span></label>
                    <input type="range" id="inp-base" min="36" max="72" value="48">
                </div>
                <div class="control-group">
                    <label>Scale</label>
                    <select id="inp-scale">
                        <option value="Major">Major</option>
                        <option value="Minor">Minor</option>
                        <option value="Pentatonic" selected>Pentatonic</option>
                        <option value="Blues">Blues</option>
                        <option value="Dorian">Dorian</option>
                        <option value="Mixolydian">Mixolydian</option>
                        <option value="Lydian">Lydian</option>
                        <option value="HarmonicMinor">Harmonic Minor</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- p5.js canvas will be created inside this div -->
    <div id="canvas-container"></div>
    
    <!-- Main application logic -->
    <script type="module" src="index.tsx"></script>
</body>
</html>
